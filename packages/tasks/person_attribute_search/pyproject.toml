[project]
name = "person-attribute-search"
version = "1.1.0"
description = "Visual Attribute Search assembly task: person attributes, tiered/person + event/anomaly + caption retrieval queries, cross-pass packaging, and HITL exports built on existing UPA services"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "NVIDIA" }
]
dependencies = [
    "core[llm]",
    "pydantic>=2.0.0",
]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
