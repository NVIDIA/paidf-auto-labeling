[project]
name = "captioning"
version = "1.1.0"
description = "Captioning task: VLM/LLM mechanics for image and video pseudo-annotation"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "NVIDIA" }
]
dependencies = [
    "core[llm]",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
video = [
    "core[video-output]",
    "numpy>=2.1.0,<3",
    "opencv-python-headless>=4.10.0.84",
]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
