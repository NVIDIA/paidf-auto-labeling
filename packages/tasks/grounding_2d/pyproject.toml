[project]
name = "grounding-2d"
version = "1.1.0"
description = "2D referring-expression grounding: VLM expressions + SAM3 boxes/masks"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "NVIDIA" }
]
dependencies = [
    "core",
    "detection-and-tracking",
    "pillow>=12.2.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
sam3 = [
    "detection-and-tracking[sam3]",
]

[tool.uv.sources]
core = { workspace = true }
detection-and-tracking = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
