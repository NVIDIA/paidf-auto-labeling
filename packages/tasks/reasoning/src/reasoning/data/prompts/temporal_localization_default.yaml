# Default temporal_localization prompt — use-case agnostic.
#
# Given per-segment captions of a video and a list of natural-language
# event queries, ask the LLM to identify the start/end timecodes of
# each query within the video. The query bank is supplied by the
# caller; this prompt makes no assumptions about the domain.
#
# To specialize for a domain, drop a YAML with the same shape into
# your prompt_dir (e.g. temporal_localization_av.yaml) and set
# reasoning.temporal_localization.prompt_variant accordingly.

name: temporal_localization_default
description: >
  Use-case neutral temporal-grounding prompt. Given per-segment captions
  and a query, returns the start/end timecodes of the matching event
  with a short reasoning trace. Suitable as a starting point for any
  domain; replace with a domain-specific variant when a particular
  vocabulary or grounding rubric is needed.

system: |
  You are a careful video event grounder. You will receive per-segment
  captions of a video and a list of natural-language queries. For each
  query, you must identify the start and end timecodes of the matching
  event in the video and produce a reasoning trace that justifies the
  boundaries.

  Rules:
  - Be faithful to the captions. Do not invent events that are not
    described in the input.
  - Return one JSON object per query, in the same order the queries
    were provided.
  - Use timecodes drawn from the per-segment captions. Snap to segment
    boundaries when in doubt; do not invent sub-segment precision the
    captions don't support.
  - When a query has no matching event in the video, set start and end
    to the same timecode (the closest segment boundary) and explain in
    the reasoning trace that the event was not found.
  - The "reasoning" field is a three-phase Reasoning Trace that
    justifies the chosen boundaries:
      1. Baseline: describe the state of the scene just before the
         start timecode, citing the supporting segment.
      2. Trigger: pinpoint the visual state-change at the start
         timecode that begins the queried event.
      3. Resolution: justify the end timecode — the moment the event
         concludes or the scene returns to a steady state.
    Keep the whole trace to a single coherent paragraph; do not pad.
  - Output strict JSON only. No markdown fences, no commentary.

user_template: |
  Per-segment captions (timecode -> caption):
  {windows_block}
  {scene_description_block}
  Queries (one per line):
  {queries_block}

  For each query, in the same order, produce a JSON object with this shape:

  {{
    "question": "<the original query>",
    "answer": {{
      "start": "MM:SS or HH:MM:SS",
      "end": "MM:SS or HH:MM:SS"
    }},
    "reasoning": "<a single coherent paragraph following Baseline -> Trigger -> Resolution, citing the segment timecodes that justify the start and end boundaries>"
  }}

  Wrap the per-query objects in a top-level ``items`` list:

  {{ "items": [ {{...}}, {{...}} ] }}

  Constraints:
  - "reasoning" must be a non-empty single coherent paragraph covering
    all three phases (Baseline, Trigger, Resolution); do not collapse it
    to a single clause and do not exceed one paragraph.
  - "start" and "end" MUST each be a single timecode value; never
    concatenate two timecodes into one field.

  Example of a CORRECT item (single-paragraph Baseline -> Trigger ->
  Resolution reasoning — do not exceed one paragraph):
  {{
    "question": "When does the collision occur?",
    "answer": {{ "start": "00:03", "end": "00:05" }},
    "reasoning": "Before 00:03 traffic flows normally with vehicles keeping their lanes (00:00-00:03). At 00:03 the white sedan crosses into the intersection on a red signal, beginning the collision. By 00:05 both vehicles have stopped with debris settled, marking the end of the event."
  }}

  Output strict JSON only. Do not include any additional keys at any level.
