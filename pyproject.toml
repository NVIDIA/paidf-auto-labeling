[project]
name = "unified-pseudo-annotation"
version = "1.1.0"
description = "Unified framework for annotating video & image data"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "NVIDIA" }
]
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.2",
    "questionary>=2.1.1",
    "ruff==0.15.12",
    "types-PyYAML",
]



[tool.mypy]
disallow_untyped_defs = true            # Disallow defining functions without type annotations
ignore_missing_imports = true           # Suppress errors about imports that cannot be resolved
no_implicit_optional = true             # Require explicit use of X | None instead of implicit Optional
show_error_codes = true                 # Show error codes in mypy output for easier reference
warn_redundant_casts = true             # Warn about unnecessary casts
warn_return_any = true                  # Warn when a function returns a value of type Any
warn_unreachable = true                 # Warn about code that will never be executed
warn_unused_ignores = true              # Warn if a `type: ignore` comment is not actually needed
# Required because package-local tests share module basenames like test_task.py.
explicit_package_bases = true
namespace_packages = true
# Match uv editable src roots so mypy keeps workspace imports typed.
mypy_path = [
    "tests/e2e",
    "packages/core/src",
    "packages/tasks/captioning/src",
    "packages/tasks/daft_validation/src",
    "packages/tasks/detection_and_tracking/src",
    "packages/tasks/example_task/src",
    "packages/tasks/person_attribute_search/src",
    "packages/tasks/reasoning/src",
    "packages/tasks/referring_expressions/src",
    "packages/tasks/super_resolution/src",
    "packages/tasks/visual_qa/src",
    "services/workflow_runner/src",
    "services/captioning_service/src",
    "services/reasoning_service/src",
    "services/detection_and_tracking_service/src",
    "services/example_service/src",
    "services/event_and_person_attribute_search_service/src",
    "services/pseudo_labeling/src",
    "services/referring_expressions_service/src",
    "services/super_resolution_service/src",
    "services/visual_qa_service/src",
]
# Placeholder for future type-check exclusions.
exclude = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",        # pycodestyle (errors)
    "F",        # pyflakes (logic errors, undefined names, etc.)
    "I",        # isort (import order)
    "N",        # pep8-naming (naming conventions)
    "UP",       # pyupgrade (modernize Python syntax)
    "B",        # bugbear (best practices and likely bugs)
    "C4",       # comprehensions (comprehension lints)
    "PLC0415",  # ungrouped-imports (prevents inline imports unless specifically allowed)
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# The telemetry module imports OpenTelemetry lazily inside functions to keep
# cold-import time low and confine the SDK import cost to when telemetry is set up.
"packages/core/src/core/utils/telemetry.py" = ["PLC0415"]

[tool.pytest.ini_options]
pythonpath = ["scripts", "tests/e2e"]
# Required because package-local tests share module basenames like test_task.py.
# End-to-end tests are deselected by default so the unit-test CI job stays fast and
# GPU/endpoint-free; `make test-e2e` re-selects them by overriding the -m expression.
addopts = "--import-mode=importlib -m 'not e2e'"
markers = [
    "e2e: end-to-end service tests that drive real service entrypoints (deselected by default; run via `make test-e2e`).",
]

[tool.coverage.run]
source = ["packages", "services", "scripts"]
omit = [
    "*/tests/*",
    ".venv/*",
    ".uv-cache/*",
    "*/.uv-cache/*",
    "*/cookbooks/*",
    "*/docs/*",
    "*/data/*",
    "*/payloads/*",
]
relative_files = true

[tool.coverage.report]
include_namespace_packages = true
show_missing = true
precision = 2
fail_under = 75.00

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/tasks/*",
    "services/*",
    "docker/media-base",
]
